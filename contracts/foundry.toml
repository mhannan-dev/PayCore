[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
no_match_path = "test/fork/*"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.fork]
no_match_path = "zzz-never-match"

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"

[lint]
exclude_lints = [
  "block-timestamp",
  "ecrecover",
  "reentrancy-no-eth",
  "incorrect-strict-equality",
  "require-revert-in-loop",
  "unsafe-typecast",
  "arbitrary-send-erc20",
]

[fmt]
line_length = 110
